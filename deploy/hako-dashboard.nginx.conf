# =============================================================================
# Hako Admin (Blazor Server) — location /dashboard  [REFERÊNCIA]
# =============================================================================
# ATENÇÃO: este arquivo NÃO é um drop-in. O nginx-proxy de produção usa um
# arquivo único (/var/www/nginx/nginx.conf montado em /etc/nginx/nginx.conf)
# — não existe conf.d. Este arquivo documenta o bloco instalado; a edição
# real é feita por deploy/install-dashboard-location.py (idempotente), que
# insere a location nos dois server{} de hakointeriores.com.br usando o
# padrão do arquivo: `set $upstream_hako_admin http://hako-admin:8080;` +
# `proxy_pass $upstream_hako_admin;` (equivalente ao proxy_pass literal
# abaixo, mas com DNS resolvido em runtime pelo resolver 127.0.0.11).
#
# O bloco `map` abaixo só é válido no contexto http{} — foi inserido uma
# única vez no topo do nginx.conf. Se você for colar esta location dentro
# de um server{}, REMOVA o map daqui (e não duplique um map equivalente).
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

location ^~ /dashboard {
    # Sem rewrite: o path completo (/dashboard/...) chega ao app, que usa
    # PathBase=/dashboard. NÃO adicionar barra final no proxy_pass.
    proxy_pass http://hako-admin:8080;
    proxy_http_version 1.1;

    # WebSocket — OBRIGATÓRIO para Blazor Server (circuito SignalR).
    # Sem estes headers a página carrega mas a interatividade morre.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Circuitos Blazor ficam ociosos por longos períodos; evita 504.
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}
