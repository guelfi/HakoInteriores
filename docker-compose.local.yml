services:
  hako-website:
    image: nginx:stable-alpine
    container_name: hako-website
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./index.css:/usr/share/nginx/html/index.css:ro
      - ./index.js:/usr/share/nginx/html/index.js:ro
      - ./images:/usr/share/nginx/html/images:ro
    networks:
      - projetos-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  projetos-local:
    external: true
