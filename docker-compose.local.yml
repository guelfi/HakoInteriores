services:
  hako-website:
    image: nginx:stable-alpine
    container_name: hako-website
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./index.css:/usr/share/nginx/html/index.css:ro
      - ./index.js:/usr/share/nginx/html/index.js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./temp:/usr/share/nginx/html/temp:ro
    networks:
      - projetos-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  hako-admin:
    build:
      context: ./backend/Hako.Admin
    container_name: hako-admin
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PathBase=/hako/dashboard
      - SiteUrl=/hako/
    networks:
      - projetos-local
    restart: unless-stopped

networks:
  projetos-local:
    external: true
