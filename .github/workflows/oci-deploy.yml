name: oci-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-compute-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required SSH credentials
        id: check_ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "::error::Missing SSH secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Add remote host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
        run: |
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Upload site to OCI (Hako Website Directory)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/var/www/Hako/website' }}
        run: |
          RDIR=${REMOTE_DIR}
          ssh "$SSH_USER@$SSH_HOST" "sudo mkdir -p $RDIR"
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --rsync-path="sudo rsync" \
            ./ "$SSH_USER@$SSH_HOST:$RDIR/"
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Deploy SSL Certificate (if configured)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          HAKO_SSL_CERT: ${{ secrets.HAKO_SSL_CERT }}
          HAKO_SSL_KEY: ${{ secrets.HAKO_SSL_KEY }}
        run: |
          if [ -z "$HAKO_SSL_CERT" ] || [ -z "$HAKO_SSL_KEY" ]; then
            echo "SSL secrets not configured, skipping certificate deployment"
            exit 0
          fi

          ssh "$SSH_USER@$SSH_HOST" 'bash -s' << 'SSLEOF'
            set -e
            SSL_DIR="/etc/ssl/hako"
            sudo mkdir -p "$SSL_DIR"
          SSLEOF

          echo "$HAKO_SSL_CERT" | ssh "$SSH_USER@$SSH_HOST" "sudo tee /etc/ssl/hako/origin.crt > /dev/null"
          echo "$HAKO_SSL_KEY" | ssh "$SSH_USER@$SSH_HOST" "sudo tee /etc/ssl/hako/origin.key > /dev/null"
          ssh "$SSH_USER@$SSH_HOST" "sudo chmod 600 /etc/ssl/hako/origin.key && sudo chmod 644 /etc/ssl/hako/origin.crt"
          echo "SSL certificate deployed to /etc/ssl/hako/"
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Rebuild and Restart Hako Containers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'bash -s' << 'EOF'
            set -e
            cd /var/www/Hako

            # Detectar comando docker compose
            if sudo docker compose version > /dev/null 2>&1; then
              DOCKER_CMD="sudo docker compose"
            else
              DOCKER_CMD="sudo docker-compose"
            fi

            CONTAINER_NAME="hako-website"
            PROXY_CONTAINER="nginx-proxy"

            # Build e recria em um único passo (sem downtime)
            echo "Build e restart do container..."
            $DOCKER_CMD up -d --build --force-recreate $CONTAINER_NAME

            # Aguarda container iniciar
            echo "Aguardando container iniciar..."
            sleep 3

            # Verifica se está rodando
            if ! sudo docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" -q | grep -q .; then
              echo "ERRO: Container $CONTAINER_NAME não está rodando!"
              sudo docker logs $CONTAINER_NAME --tail 30
              exit 1
            fi

            # Conectar à rede do proxy (se necessário)
            PROXY_NET=$(sudo docker inspect $PROXY_CONTAINER -f '{{range $net,$v := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null | awk '{print $1}')

            if [ -n "$PROXY_NET" ]; then
              # Verifica se já está conectado
              CURRENT_NETS=$(sudo docker inspect $CONTAINER_NAME -f '{{range $net,$v := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null)
              if echo "$CURRENT_NETS" | grep -q "$PROXY_NET"; then
                echo "Container já conectado à rede $PROXY_NET"
              else
                echo "Conectando à rede $PROXY_NET..."
                sudo docker network connect "$PROXY_NET" "$CONTAINER_NAME"
              fi
            else
              echo "ERRO: Container $PROXY_CONTAINER não encontrado ou sem rede!"
              echo "Tentando redes conhecidas..."
              sudo docker network connect proxy "$CONTAINER_NAME" 2>/dev/null || \
              sudo docker network connect nginx-proxy "$CONTAINER_NAME" 2>/dev/null || \
              { echo "FALHA: Não foi possível conectar à rede do proxy"; exit 1; }
            fi

            echo "Deploy concluído. Status:"
            sudo docker ps --filter "name=$CONTAINER_NAME" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Health Check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
        run: |
          echo "Aguardando serviço estabilizar..."
          sleep 5

          # Teste local via docker exec (DNS do Docker só funciona dentro de containers)
          ssh "$SSH_USER@$SSH_HOST" 'bash -s' << 'EOF'
            set -e
            CONTAINER_NAME="hako-website"

            for i in 1 2 3; do
              code=$(sudo docker exec $CONTAINER_NAME curl --max-time 5 -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
              echo "Teste local (tentativa $i): HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Health check local OK"
                exit 0
              fi
              sleep 3
            done

            echo "curl não disponível no container, testando via docker inspect..."
            CONTAINER_IP=$(sudo docker inspect $CONTAINER_NAME -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' | awk '{print $1}')
            if [ -n "$CONTAINER_IP" ]; then
              code=$(curl --max-time 5 -s -o /dev/null -w "%{http_code}" "http://$CONTAINER_IP:80/" 2>/dev/null || echo "000")
              echo "Teste via IP ($CONTAINER_IP): HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Health check via IP OK"
                exit 0
              fi
            fi

            echo "AVISO: Health check local falhou"
            sudo docker logs $CONTAINER_NAME --tail 20
            exit 1
          EOF
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: External Verification
        run: |
          echo "Verificando acesso externo..."
          sleep 5
          for i in 1 2 3; do
            code=$(curl --max-time 10 -s -o /dev/null -w "%{http_code}" https://www.hakointeriores.com.br/ || echo "000")
            echo "Teste externo (tentativa $i): HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site acessível externamente!"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Site não retornou HTTP 200 externamente. Verifique Cloudflare/DNS."
        continue-on-error: true
        if: steps.check_ssh.outputs.has_ssh == 'true'
