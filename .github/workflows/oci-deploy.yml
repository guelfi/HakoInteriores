name: oci-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-compute-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required SSH credentials
        id: check_ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              missing+=("$v")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Add remote host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
        run: |
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Upload site to OCI (Hako Website Directory)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/var/www/Hako/website' }}
        run: |
          RDIR=${REMOTE_DIR}
          ssh "$SSH_USER@$SSH_HOST" "sudo mkdir -p $RDIR"
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --rsync-path="sudo rsync" \
            ./ "$SSH_USER@$SSH_HOST:$RDIR/"
        if: steps.check_ssh.outputs.has_ssh == 'true'

      - name: Rebuild and Restart Hako Containers
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          PROJECT_ROOT: "/var/www/Hako"
          CONTAINER_NAME: "hako-website"
        run: |
          ssh "$SSH_USER@$SSH_HOST" "
            cd $PROJECT_ROOT
            
            if sudo docker compose version > /dev/null 2>&1; then
              DOCKER_CMD='sudo docker compose'
            else
              DOCKER_CMD='sudo docker-compose'
            fi
            
            echo \"Limpando conflitos para: $CONTAINER_NAME\"
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm -f $CONTAINER_NAME || true
            
            echo \"Iniciando Build e Up...\"
            \$DOCKER_CMD build $CONTAINER_NAME
            \$DOCKER_CMD up -d --force-recreate $CONTAINER_NAME
            
            echo \"--- DIAGNÓSTICO PÓS-DEPLOY ---\"
            echo \"Status do Container:\"
            sudo docker ps | grep $CONTAINER_NAME
            echo \"Logs do Container (últimas 20 linhas):\"
            sudo docker logs --tail 20 $CONTAINER_NAME
            echo \"Redes conectadas:\"
            sudo docker inspect $CONTAINER_NAME --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} ({{.NetworkID}}){{end}}'
          "
        if: steps.check_ssh.outputs.has_ssh == 'true'
